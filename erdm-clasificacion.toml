# ============================================================
#  erdm-clasificacion.toml — qué se hace con cada config
#
#  Postura por defecto: TODO lo que no aparezca aquí es SEMILLA.
#  Semilla = se copia si el jugador no lo tiene, se actualiza si
#  no lo tocó, y NUNCA se pisa si lo personalizó. Es el modo seguro;
#  por eso solo hace falta listar las excepciones.
#
#  [fuera]    — no lo gestiona el pack. Puede ser: estado personal
#               (una preferencia de máquina, de mundo, de servidor
#               guardado), una caché que el mod regenera solo, o un
#               archivo huérfano de un mod que ya no está instalado.
#               El script de siembra no lo toca en ningún sentido.
#
#  [forzado]  — se sobrescribe siempre con el valor del pack, igual
#               que hoy. Reservado para lo que rompe la compatibilidad
#               con el servidor si el jugador lo cambia (fecha límite:
#               solo lo estrictamente necesario, cuanto más forzado
#               hay, más se repite el problema que origina este archivo).
#
#  Sintaxis: una ruta por línea bajo cada sección, relativa a config/.
#  Comentarios con #.
# ============================================================

[fuera]

# --- Ajustes por máquina (GPU, mando, shader elegido) ----------
sodium-options.json
sodium-extra.properties
iris.properties

# NOTA (14-sep-2026): sodium-extra-options.json SALIÓ de esta lista.
