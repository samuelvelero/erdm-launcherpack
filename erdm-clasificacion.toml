# ============================================================
#  Revisión del 13-sep-2026 — 11 de los 12 originales, degradados
# ============================================================
#  Samukis pidió revisar [forzado] a fondo. Se leyó el contenido real
#  de los 12 archivos (no solo el nombre) y 11 no se sostienen:
#
#  --- Rendimiento puro de cliente, cero relación con el servidor ---
#  ferritecore.mixin.properties : toggles de memoria (deduplicación de
#    blockstates, mapas de componentes). Nada que sincronizar.
#  lithium.properties / sodium-mixins.properties : ambos VACÍOS salvo
#    el comentario de cabecera -- no hay ni un ajuste que forzar hoy.
#
#  --- Patrón cliente/servidor del propio proceso, no del servidor
#      dedicado real (que tiene su copia aparte, en su propia máquina,
#      ajena a este pack) ---
#  fieldguide-server.json / pickupnotifier-server.toml /
#  reachbehind-server.toml / bettercombat/server.json5 / pingwheel.
#  server.json : el sufijo "-server"/"server.json5" es el "lado
#  servidor de este mismo proceso" (relevante solo si el jugador
#  hostea su propio mundo, singleplayer o LAN), NO el servidor
#  dedicado de ERDM. reachbehind-server.toml lo confirma en su propio
#  comentario: "This option only takes effect in singleplayer and for
#  players on a multiplayer server which has this mod installed."
#  Forzarlos solo le rompe la personalización a quien juegue su propio
#  mundo con este mismo pack.
#
#  --- Personalización que el pack no debería bloquear ---
#  simple-rpc/server-entries.toml : lista de "qué nombre mostrar en
#    Discord para cada IP de servidor". Contenido real: enabled=false,
#    entry=[] (vacía, desactivada). Forzarla le impide a un jugador
#    añadir sus propios servidores a su propia lista.
#
#  Los 11 pasan a SEMILLA (el default de todo lo no listado): el pack
#  sigue proponiendo un valor razonable, pero deja de pisarlo si el
#  jugador lo toca. No hacía falta escribirlos aquí -- se listan solo
#  para que quede constancia de que SÍ se revisaron, no que se
#  olvidaron.
#
#  Si Samukis conoce alguna razón real de compatibilidad con el plugin
#  del servidor para volver a forzar alguno de estos, añadirlo aquí con
#  esa razón explícita -- no por el nombre del archivo.
