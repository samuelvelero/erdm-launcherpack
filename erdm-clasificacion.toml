#     ("Audio packets are always transmitted... independently of other
#     networking used for the game server", "port=24454",
#     "bind_address="). Es la configuración de un Simple Voice Chat
#     SERVIDOR (puerto, IP de bind). En el cliente que se conecta a
#     54.39.173.193:25598, este archivo no lo lee nadie -- inofensivo,
#     pero no gestiona nada real y no debería seguir en el pack.
