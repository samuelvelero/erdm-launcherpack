#     genera al conectarse, no un ajuste que el pack deba empujar ---
#
#   NCR-ServerPreferences.json : contenido real, {"signingModes": {}}.
#     El nombre lo delata -- "Preferences" que NoChatReports detecta y
#     guarda POR SERVIDOR al conectarse, no algo que el pack fije de
#     antemano. Forzarlo no protege nada: en cuanto el jugador se
#     conecta, el propio mod lo vuelve a escribir según lo que el
#     servidor real le diga.
