# Default scale / zoom level for terrain.
# 0 to use GUI scale, -1 to use half.
# range: -1 - 10
# default: -1
defaultScale = -1
# How many extra zoom-out steps past the old minimum are allowed.
# Each step doubles how much world fits on screen: 4 steps is 16x wider.
# Far-out zoom samples one map pixel out of many, so it gets grainy. 0 disables.
# range: 0 - 8
# default: 4
extraZoomOutSteps = 4

# Options to change the visuals of the map to be more or less vanilla-style.
[style]
	# Whether to color the water based on biome.
	# Disable for a vanilla style.
	# default: false
	biomeWater = false
	# Whether to color grass and foliage blocks based on biome.
	# Disable for a vanilla style.
	# default: false
	biomeFoliage = false
	# How large of an area to blend biome colors for water and foliage.
	# Set to 0 for no blending. Higher is more performance intensive.
	# range: 0 - 16
	# default: 9
	blendRadius = 9
	# Whether to override the base color of odd-colored blocks like stone, ice, and leaf variants.
	# Disable for a vanilla style.
	# default: false
	accurateColors = false
	# Whether to render water as transparent, becoming more opaque in deep waters.
	# Disable for a vanilla style.
	# default: false
	transparentWater = false
	# Whether to consider sky and block lighting when coloring map pixels.
	# Disable for a vanilla style.
	# default: false
	lighting = false
	# What level of skylight to use when in cave mode.
	# range: 0 - 15
	# default: 8
	ambientLight = 8
	# Whether to shade the map based on relative elevation and water depth.
	# Enable for a vanilla style. Disable for a very flat map.
	# default: true
	topography = true
	# Whether to draw stacks tinted black underneath themselves to create an outline.
	# Noticeable performance cost with many stacks on screen.
	# default: true
	itemOutlines = true
	# Whether to show disconnected players and offline group members on the map.
	# default: true
	offlinePlayers = true
	# Whether to render the map-textured background to help show valid pan areas.
	# default: true
	mapBackground = true
	# How much smaller markers get at maximum zoom-out, as a percentage.
	# Scales down linearly across the extra zoom-out steps. 0 keeps them fixed.
	# range: 0 - 75
	# default: 33
	landmarkZoomShrink = 33

# Options for the pencil - freehand strokes and shapes drawn on the map.
[drawing]
	# Stroke thickness, in screen pixels.
	# range: 1 - 8
	# default: 2
	thickness = 2
	# Colour new strokes are drawn with, as decimal RGB. 16762977 is amber.
	# range: 0 - 16777215
	# default: 16762977
	color = 16762977
	# Opacity of the fill inside a closed shape, 0-255.
	# range: 0 - 255
	# default: 60
	fillOpacity = 60
	# How far the cursor must travel before a freehand stroke records a point.
	# In screen pixels. Higher means fewer points stored and a smoother line.
	# range: 1 - 32
	# default: 3
	minPointSpacing = 3
	# How close to the first point you must click to close a shape, in screen pixels.
	# range: 2 - 32
	# default: 8
	closeSnapPixels = 8
	# Whether new strokes are smoothed into a curve through their points.
	# Smoothing is geometry only: the line still rasterises as hard pixels.
	# default: true
	smoothByDefault = true
	# How close the cursor must be to a stroke to select it, in screen pixels.
	# range: 1 - 32
	# default: 6
	hoverReachPixels = 6

# Options for zones - areas you paint on the map to organise yourself.
[zones]
	# Thickness of the zone outline, in screen pixels.
	# range: 1 - 8
	# default: 2
	outlineThickness = 2
	# Opacity of the zone fill, 0-255.
	# range: 0 - 255
	# default: 68
	fillOpacity = 68
	# Colour new zones are drawn with, as decimal RGB. 5636095 is light blue.
	# range: 0 - 16777215
	# default: 5636095
	draftColor = 5636095

# Options for sepia - terrain other players explored but you haven't.
[sepia]
	# Whether to tint terrain you haven't explored yourself.
	# Only applies on servers, and only to terrain someone else explored for you.
	# default: true
	enabled = true
	# How strong the tint is, as a percentage.
	# At 100 the hue is gone entirely: biome borders still read, but not which biome.
	# range: 0 - 100
	# default: 100
	strength = 100

# Options for pings - temporary markers placed with the mouse wheel on the map.
[pings]
	# Whether to draw pings in the player's view.
	# When disabled they still show on the map.
	# default: true
	showInWorld = true
	# How many pings can be active at once, per dimension.
	# Placing one past the limit removes the oldest.
	# range: 1 - 16
	# default: 3
	maxActive = 3
	# Size of the ping diamond on screen, in pixels.
	# The texture is 16x16, so 8 draws it at half size.
	# range: 4 - 32
	# default: 8
	iconSize = 8
	# Whether to draw the distance in blocks underneath each ping.
	# default: true
	showDistance = true
	# How far from the screen edge to hold pings that are out of view, in pixels.
	# range: 0 - 64
	# default: 12
	edgeMargin = 12
	# What height to place map pings at when the spot has no explored terrain.
	# range: -64 - 320
	# default: 64
	defaultY = 64
	# Whether pings can be placed from the world with the ping key.
	# The key is bound to the mouse wheel by default, same as on the map.
	# default: true
	crosshairPings = true
	# How long pings placed from the world last, in seconds.
	# Set to 0 to make them permanent. Pings placed from the map never expire.
	# range: 0 - 3600
	# default: 30
	crosshairLifetime = 30
	# How far the ping key reaches when looking for a block, in blocks.
	# range: 8 - 512
	# default: 128
	crosshairRange = 128
	# How close to an existing ping the ping key has to land to remove it instead.
	# range: 1 - 32
	# default: 4
	crosshairRemoveRadius = 4

# Options to adjust map behaviour for custom or modified dimensions.
[dimensions]
	# Which lightmap to use for dimensions not specified below.
	# This changes the color tone of the lighting, when lighting is enabled.
	# options: DAY, NIGHT, NETHER, END
	# default: DAY
	defaultLightmap = "DAY"

	# Cycle order and coordinate scales of each dimension.
	# If not 0, the relative position of the player will be shown.
	[dimensions.scales]
		"minecraft:overworld" = 8
		"minecraft:the_nether" = 1
		"minecraft:the_end" = 0

	# Which lightmap to use for each dimension.
	# This changes the color tone of the lighting, when lighting is enabled.
	[dimensions.lightmaps]
		"minecraft:the_nether" = "NETHER"
		"minecraft:the_end" = "END"

	# What Y co-ordinate to start the map at, in non-cave mode.
	[dimensions.ceilings]
		"minecraft:the_nether" = 126

# Options for debugging issues with hoofprint.
[debug]
	# Whether to log every time map area baking is started.
	# default: false
	logBaking = false
	# How many ticks to wait between baking regions.
	# range: 1 - 200
	# default: 20
	ticksPerBake = 20
	# I wonder what this could be?
	# options: TRY, ALT, MIDDLE, CLICKING, THE, MAP
	# default: TRY
	redHerring = "TRY"
